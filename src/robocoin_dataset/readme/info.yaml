# ========== Feature Definitions ==========
features:
  value:
    observation.images.camera_1:
      dtype: "video"
      shape: [720, 1280, 3]
      names: ["height", "width", "channels"]
      info:
        video.fps: 30
        video.codec: "h264"
    observation.state:
      dtype: "float32"
      shape: [14]
      names: ["joint_1", "joint_2", ...]
    action:
      dtype: "float32"
      shape: [7]
      names: ["action_1", "action_2", ...]
    timestamp:
      dtype: "float64"
    frame_index:
      dtype: "int64"
    episode_index:
      dtype: "int64"
    subtask_annotation:
      dtype: "string"
    scene_annotation:
      dtype: "string"
    eef_sim_pose_state:
      dtype: "float32"
      shape: [7]
      names: ["x", "y", "z", "qx", "qy", "qz", "qw"]
  required: null
  source: null
# Feature definitions (complete copy from meta/info.json)

