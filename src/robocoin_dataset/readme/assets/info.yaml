  value: null
  required: null
  source: null
# Dataset UUID (usually auto-generated)

# ========== Environment Information ==========
scene_type:
  value: null
  required: null
  source: null
# Strictly fill in according to the scene library.
# --- README -----
# home-kitchen.
# MUST follow the format: level1-level2-...
# ----------------

env_type:
  value: null
  required: null
  source: null
# --- README -----
# simulation/real.
# MUST follow the format: simulation/real. one in two choices
# ----------------

objects:
  value: null
  required: null
  source: null
# that is object_list, get from local_dataset_info.yaml
# --- README -----
# furniture-table.
# container-basket.
# MUST follow the format: object_name-level1-level2-...
# ----------------

# ========== Task Information ==========

task_operation_type:
  value: null
  required: null
  source: null
# dual_arm..., that is task_type.
# --- README -----
# simgle_arm/dual_arm/othes...
# MUST follow the format: simgle_arm/dual_arm/others... Choose one.
# ----------------

task_result:
  value: null
  required: null
  source: null
# --- README -----
# success/failure.
# MUST follow the format: success/failure. one in two choices
# ----------------

tasks:
  value: null
  required: null
  source: null
# i.e. task_instruction, this is the natural language instruction.
# --- README -----
# "instruction_string"
# ----------------

task_name:
  value: null
  required: null
  source: null
# From local_dataset_info.yaml, dataset_name, is the standardized task name.
# --- README -----
# "Agibot_g1_Pick_apple"
# ----------------

task_description:
  value: null
  required: null
  source: null
# From local_dataset_info.yaml, task_description, is the standardized task description.
# --- README -----
# "{Left_arm, Right_arm}+{atomic skill}+{Object}"
# MUST follow the format: "{Left_arm, Right_arm}+{atomic skill}+{Object}".
# ----------------

sub_tasks:
  value: null
  required: null
  source: null
# that is subtask_list, get from annotations/subtask_annotations.jsonl
# --- README -----
# "Grasp the apple with the left gripper"
# "Place the apple into the basket with the left gripper"
# "End"
# MUST follow the format: "subtask_string". display as a list, iterate through.
# ----------------

atomic_actions:
  value: null
  required: null
  source: null
# that is skill_list, get from local_dataset_info.yaml
# --- README -----
# "pick"
# "place"
# "grasp"
# MUST follow the format: "atomic_action_string". display as a list, iterate through.
# ----------------

