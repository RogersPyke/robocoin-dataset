######################################################

# ========== Basic Information ==========

codebase_version:
  value: null
  required: true
  source: "fixed"
# that is codebase_version, get from local_dataset_info.yaml

dataset_name:
  value: null
  required: true
  source: "local_dataset_info.yaml"
# Dataset Name, format: {robot}_{task_name}

dataset_uuid:
  value: null
  required: true
  source: "local_dataset_info.yaml"
# Dataset UUID (usually auto-generated)

# ========== Environment Information ==========
scene_type:
  value: null
  # e.g. 
  #   level1: home
  #   level2: kitchen
  #   level3:
  #   level4:
  #   level5:
  required: true
  source: "local_dataset_info.yaml"
# Strictly fill in according to the scene library.
# --- README -----
# home-kitchen.
# MUST follow the format: level1-level2-...
# ----------------

env_type:
  value: null
  # e.g.
  #   simulation /real world
  required: true
  source: "local_dataset_info.yaml"
# --- README -----
# simulation/real.
# MUST follow the format: simulation/real. one in two choices
# ----------------

objects:
  value: null
  # e.g.
  #   level1: furniture
  #   level2: table
  #   level3:
  #   level4:
  #   level5:
  required: true
  source: "local_dataset_info.yaml"
# that is object_list, get from local_dataset_info.yaml
# --- README -----
# furniture-table.
# container-basket.
# MUST follow the format: object_name-level1-level2-...
# ----------------

# ========== Task Information ==========

task_operation_type:
  value: null
  # e.g.
  #   dual_arm /single_arm
  required: true
  source: "local_dataset_info.yaml"
# dual_arm..., that is task_type.
# --- README -----
# simgle_arm/dual_arm/othes...
# MUST follow the format: simgle_arm/dual_arm/others... Choose one.
# ----------------

task_result:
  value: null
  # e.g.
  #   success/failure
  required: true
  source: "annotations/subtask_annotations.jsonl"
# --- README -----
# success/failure.
# MUST follow the format: success/failure. one in two choices
# ----------------

task_instruction:
  value: null
  # e.g.
  #   "put_apple_into_basket"
  required: true
  source: "local_dataset_info.yaml"
# i.e. task_instruction, this is the natural language instruction.
# NOTE: MUST distinguish the task_instruction from task_descriptions.
# former is the natural language instruction, latter is the task sub-process description.(How to do the task)
# ----------------
# However, in the local_dataset_info.yaml, the task_instruction is actually the task_descriptions.
# ----------------

task_description:
  value: null
  # e.g.
  #   - "Grab and lift both the mouse and power cord from the accessory packaging area at the same time"
  #   - "Place the mouse and power cord into the accessory packaging area"
  #   - "End"
  required: ture
  source: "annotations/subtask_annotations.jsonl"
# From local_dataset_info.yaml, task_description, is the standardized task description.
# --- README -----
# "{Left_arm, Right_arm}+{atomic skill}+{Object}"
# MUST follow the format: "{Left_arm, Right_arm}+{atomic skill}+{Object}".
# ----------------

task_name:
  value: null
  # e.g.
  #   "Agibot_g1_pick_apple"
  required: true
  source: "local_dataset_info.yaml"
# From local_dataset_info.yaml, dataset_name, is the standardized task name.
# format: {Robot_name}+{composite action}+{Object}

sub_tasks:
  value: null
  required: null
  source: null
# that is subtask_list, get from annotations/subtask_annotations.jsonl
# NOTE: Is redundent with task_description?
# TODO: Check if it is needed.
# ----------------

atomic_actions:
  value: null
  # e.g.
  #   - "pick"
  #   - "pull"
  #   - "push"
  #   - "open"
  required: true
  source: "local_dataset_info.yaml"
# that is so-called skill_list, get from local_dataset_info.yaml

# ========== Robot Configuration Info ==========

robot_name:
  value: null
  # e.g.
  #   "Agibot_g1"
  required: true
