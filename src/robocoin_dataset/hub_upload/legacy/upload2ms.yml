# upload_ms.yml
# used to config class LocalDsUploadConfig
# class LocalDsUploadConfig(LocalDsConfig):

# ---------------------------------------------------------------------------
# refer to
# class LocalDsUploadConfig(LocalDsConfig):
#     hub_name: DatasetsHubEnum = DatasetsHubEnum.HUGGINGFACE
#     token: str = ""
#     namespace: str = ""
#     output_path: str = ""

# Path to the directory containing task tags YAML files.
# which hub to upload to
# Huggingface or Modelscope
hub_name: modelscope
# NOTICE: must match the def in DatasetsHubEnum, in @dataclass -> class LocalDsUploadConfig(LocalDsConfig):

# token for authentication with the hub.
token: NULL  # Configuring this parameter is not recommended; manual specification is preferred.

# namespace (username) on the hub platform.
# IMPORTANT: This must match your ModelScope username exactly (case-sensitive).
# Example: If your profile is https://www.modelscope.cn/YourUsername, use "YourUsername"
# If left empty, defaults to DS_PLATFORM_NAME constant in code.
namespace: "RoboCOIN"  # CHANGE THIS to your actual ModelScope username

# output path where the history info of dataset uploading should be saved.
output_path: ./examples/datasets/outputs/upload_history

# ---------------------------------------------------------------------------
# UPLOAD MODE SELECTION (mutually exclusive - choose ONE):
# ---------------------------------------------------------------------------
# Option 1: Database-driven upload (RECOMMENDED)
# Specify the database file path to upload datasets tracked in the database.
# This is the recommended approach for production use.
# You MUST explicitly choose the upload mode via command line:
#   --db_file_path <path>       : Use specified path
#   --db_file_path default      : Use the path below from this YAML config
db_file_path: "/path/to/your/datasets_new.db"  # Default path when using --db_file_path default
# Example: db_file_path: "/home/user/robocoin-dataset/db/datasets_new.db"

# Option 2: Directory-based upload (LEGACY)
# Use root_path (specified below) to scan and upload all datasets in a directory.
# You MUST explicitly choose the upload mode via command line:
#   --root_path <path>          : Use specified path
#   --root_path default         : Use the root_path below from this YAML config
# Note: db_file_path and root_path cannot both be specified on command line.

# Skip datasets with missing paths instead of aborting.
skip_missing: false

# ---------------------------------------------------------------------------
# refer to
# class LocalDsConfig:
#     root_path: Path = field(default_factory=Path)
#     process_all: bool = True
#     subdirs_to_process: list[str] = field(default_factory=list)
#     subdirs_to_ignore: list[str] = field(default_factory=list)
#     log_config: LogConfig = field(default_factory=LogConfig)

# Path to the root directory of the datasets, which contains all datasets.
root_path: /mnt/nas/synnas/docker2/robocoin-datasets-test/_upload_test/
# SHOULD BE CHANGED TO THE REAL DATASET PATH WHEN FORMAL USING


# process_all is set to true by default,
# it means all subdirectories will be processed,
process_all: true

# if you want to process only specific subdirectories,
# set it to false and use subdirs_to_process to specify which subdirectories to process.
# process_all: false

# subdirs_to_process will not be considered if process_all is set to true.
# or you can use the following format to specify subdirs to process,
# each subdir will be considered as a separate dataset.
# process_all: false
# subdirs_to_process:
  # - realman_task_build_blocks_500_4.18
  # - realman_task_stack_basket_500_4.27
subdirs_to_process: []

# subdirs_to_ignore is set to empty list by default,
# it means no subdirectories will be ignored.
# subdirs_to_ignore: []
# or you can use the following format to specify subdirs to ignore.
subdirs_to_ignore:
  - not_a_dataset_dir

# Log configuration
log_config:
    # where to save log files, the log directory will be created if it does not exist
    log_dir: ./examples/datasets/logs/dataset_uploads
    # whether to log to console
    log_to_console: true
    # log level, can be DEBUG, INFO, WARNING, ERROR, CRITICAL
    log_level: INFO


# ---------------------------------------------------------------------------
# Usage Examples:
#
# 1. Database-driven upload (RECOMMENDED):
# python scripts/hub_upload/upload2hub.py \
#   --config examples/configs/upload2ms.yml \
#   --db_file_path /path/to/datasets_new.db \
#   --token YOUR_MS_TOKEN
#
# 2. Directory-based upload (LEGACY):
# python scripts/hub_upload/upload2hub.py \
#   --config examples/configs/upload2ms.yml \
#   --root_path /path/to/datasets/directory \
#   --token YOUR_MS_TOKEN
#
# Note: You cannot specify both --db_file_path and --root_path simultaneously.
