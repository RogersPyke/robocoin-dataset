fps: 30  # 需根据实际collection_frequency调整

features:
  observation:
    images:
      # RGB cameras only (不包含depth，按用户要求)
      - cam_name: cam_chest_rgb
        args:
          h5_path: "observations/camera/rgb/chest/images"
      
      - cam_name: cam_head_rgb
        args:
          h5_path: "observations/camera/rgb/head/images"
      
      - cam_name: cam_left_wrist_rgb
        args:
          h5_path: "observations/camera/rgb/left/images"
      
      - cam_name: cam_right_wrist_rgb
        args:
          h5_path: "observations/camera/rgb/right/images"

    state:
      # Total dimensions: 16 (7+7+1+1) - 无末端姿态数据
      sub_state:
        # 左臂关节 (7维)
        - names:
            - left_arm_joint_1_rad
            - left_arm_joint_2_rad
            - left_arm_joint_3_rad
            - left_arm_joint_4_rad
            - left_arm_joint_5_rad
            - left_arm_joint_6_rad
            - left_arm_joint_7_rad
          args:
            h5_path: "observations/arm/left/joints"
            range_from: 0
            range_to: 7
          convert_func: degree2rad
        
        # 右臂关节 (7维)
        - names:
            - right_arm_joint_1_rad
            - right_arm_joint_2_rad
            - right_arm_joint_3_rad
            - right_arm_joint_4_rad
            - right_arm_joint_5_rad
            - right_arm_joint_6_rad
            - right_arm_joint_7_rad
          args:
            h5_path: "observations/arm/right/joints"
            range_from: 0
            range_to: 7
          convert_func: degree2rad
        
        # 左夹爪位置 (1维)
        - names:
            - left_gripper_open
          args:
            h5_path: "observations/effector/left/position"
            range_from: 0
            range_to: 1
        
        # 右夹爪位置 (1维)
        - names:
            - right_gripper_open
          args:
            h5_path: "observations/effector/right/position"
            range_from: 0
            range_to: 1
        
        # ⚠️ 以下字段已排除:
        # - observations/arm/left/pose (Shape: (0,), empty)
        # - observations/arm/right/pose (Shape: (0,), empty)
        # - observations/arm/left/wrench (100% 全零)
        # - observations/arm/right/wrench (100% 全零)
        # - observations/chassis/pose (100% 全零)
        # - observations/chassis/status (100% 全零)
        # - observations/chassis/vel (100% 全零)
        # - observations/neck/joints (100% 全零)
        # - observations/torso/joints (100% 全零)
        # - observations/torso/pose (100% 全零)

  action:
    timeline_offset: 1
    # ⚠️ H5文件中的action group为空
    # 使用observation数据作为action（典型的模仿学习设置）
    sub_action:
      # 左臂关节动作 (7维)
      - names:
          - left_arm_joint_1_rad
          - left_arm_joint_2_rad
          - left_arm_joint_3_rad
          - left_arm_joint_4_rad
          - left_arm_joint_5_rad
          - left_arm_joint_6_rad
          - left_arm_joint_7_rad
        args:
          h5_path: "observations/arm/left/joints"
          range_from: 0
          range_to: 7
      
      # 右臂关节动作 (7维)
      - names:
          - right_arm_joint_1_rad
          - right_arm_joint_2_rad
          - right_arm_joint_3_rad
          - right_arm_joint_4_rad
          - right_arm_joint_5_rad
          - right_arm_joint_6_rad
          - right_arm_joint_7_rad
        args:
          h5_path: "observations/arm/right/joints"
          range_from: 0
          range_to: 7
      
      # 左夹爪动作 (1维)
      - names:
          - left_gripper_open
        args:
          h5_path: "observations/effector/left/position"
          range_from: 0
          range_to: 1
      
      # 右夹爪动作 (1维)
      - names:
          - right_gripper_open
        args:
          h5_path: "observations/effector/right/position"
          range_from: 0
          range_to: 1
