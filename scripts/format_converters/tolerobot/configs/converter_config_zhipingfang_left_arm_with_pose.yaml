fps: 30  # 需根据实际collection_frequency调整

features:
  observation:
    images:
      # 只有head和left_wrist摄像头有数据
      # chest和right摄像头为空 (Shape: (0,))
      - cam_name: cam_head_rgb
        args:
          h5_path: "observations/camera/rgb/head/images"
      
      - cam_name: cam_left_wrist_rgb
        args:
          h5_path: "observations/camera/rgb/left/images"

    state:
      # Total dimensions: 14 (7+6+1)
      # 只有左臂数据
      sub_state:
        # 左臂关节 (7维)
        - names:
            - left_arm_joint_1_rad
            - left_arm_joint_2_rad
            - left_arm_joint_3_rad
            - left_arm_joint_4_rad
            - left_arm_joint_5_rad
            - left_arm_joint_6_rad
            - left_arm_joint_7_rad
          args:
            h5_path: "observations/arm/left/joints"
            range_from: 0
            range_to: 7
          convert_func: degree2rad
        
        # 左臂末端执行器姿态 (6维: position xyz + euler xyz)
        - names:
            - left_eef_pos_x_m
            - left_eef_pos_y_m
            - left_eef_pos_z_m
            - left_eef_rot_euler_x_rad
            - left_eef_rot_euler_y_rad
            - left_eef_rot_euler_z_rad
          args:
            h5_path: "observations/arm/left/pose"
            range_from: 0
            range_to: 6
        
        # 左夹爪位置 (1维)
        - names:
            - left_gripper_open
          args:
            h5_path: "observations/effector/left/position"
            range_from: 0
            range_to: 1
        
        # ⚠️ 以下字段已排除:
        # - observations/arm/left/wrench (有数据但不用于控制)
        # - observations/arm/right/* (Shape: (0,), empty)
        # - observations/chassis/pose (100% 全零)
        # - observations/chassis/status (100% 全零)
        # - observations/chassis/vel (100% 全零)
        # - observations/neck/joints (100% 全零)
        # - observations/torso/joints (100% 全零)
        # - observations/torso/pose (100% 全零)
        # - observations/effector/right/position (右臂数据为空)
        # - observations/camera/rgb/chest (Shape: (0,), empty)
        # - observations/camera/rgb/right (Shape: (0,), empty)

  action:
    timeline_offset: 1
    # ⚠️ H5文件中的action/actions group为空
    # 使用observation数据作为action（典型的模仿学习设置）
    sub_action:
      # 左臂关节动作 (7维)
      - names:
          - left_arm_joint_1_rad
          - left_arm_joint_2_rad
          - left_arm_joint_3_rad
          - left_arm_joint_4_rad
          - left_arm_joint_5_rad
          - left_arm_joint_6_rad
          - left_arm_joint_7_rad
        args:
          h5_path: "observations/arm/left/joints"
          range_from: 0
          range_to: 7
      
      # 左臂末端执行器姿态动作 (6维)
      - names:
          - left_eef_pos_x_m
          - left_eef_pos_y_m
          - left_eef_pos_z_m
          - left_eef_rot_euler_x_rad
          - left_eef_rot_euler_y_rad
          - left_eef_rot_euler_z_rad
        args:
          h5_path: "observations/arm/left/pose"
          range_from: 0
          range_to: 6
      
      # 左夹爪动作 (1维)
      - names:
          - left_gripper_open
        args:
          h5_path: "observations/effector/left/position"
          range_from: 0
          range_to: 1
